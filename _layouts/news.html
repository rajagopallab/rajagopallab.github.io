---
layout: default
---

{{ content }}

<div class="row g-5 mb-5">
  <div class="col-md-12">
    <h3 class="fw-bold border-bottom pb-3 mb-5">news</h3>
    {% for post in site.posts %}
      <h4 class="fw-bold"><a name={{post.anchor}}>{{ post.title }}</a></h4>
      <h4>{{ post.date | date: "%B %-d, %Y" }}</h4>
      <p>{{ post.content }}</p>
    {% endfor %}
  </div>
</div>
