  about: 'Yiyi is a junior undergraduate student at the University of Michigan, majoring in Physics and Mathematics. He joined the Rajagopal Lab in Spring 2025. Prior to that, he conducted research on the Gromov hyperbolicity of the fine arc graph in the University of Michigan Lab of Geometry and worked on improving methods for detecting continuous gravitational waves. Outside of academics, Yiyi enjoys rock climbing (still learning—and still falling), cycling, hiking, and playing the violin.',
