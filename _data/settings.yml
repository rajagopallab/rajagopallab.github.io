  about: 'Liam is a first year physics graduate student at the University of Michigan. He earned his B.S. in Physics from the University of North Texas in 2024, where he worked in the lab of Jens Neu on THz-Time Domain Spectroscopy. In 2023, he participated in the University of Michigan NSF REU program, working with the Goldman group on simulations of carrier concentration in submonolayer quantum dots. Outside the lab, Liam enjoys playing stringed instruments, hiking, kayaking, and both watching and learning how to play hockey.',
