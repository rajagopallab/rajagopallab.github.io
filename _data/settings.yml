}
- {name: 'Riva Jangra',
  title: 'Visiting Researcher',
  pronouns: 'she/her',
  department: 'Physics',
  institution: 'Dartmouth College, Perimeter Institute',
  institution_address: '6127 Wilder Laboratory Hanover, NH 03755-3528',
  phone: '7752257355',
  email: 'riva.jangra.GR [at] umich [dot] edu',
  office: 'Homer A. Neal Lab',
  lab: 'Homer A. Neal Lab 3214' ,
  image: 'assets/img/rivajangra.png',
  about: 'Riva is a visiting researcher from the Perimeter Institute who will begin her PhD in physics at Dartmouth College in Fall 2025. Over the past year she’s helped build the atomic-level compiler infrastructure for Professor Rajibul Islam’s trapped-ion quantum computer, explored AI applications in Celestial Holography with Professor Sabrina Pasterski, and most recently worked on topological graph theoretic applications for superconducting qubits with Professor Andrew Houck’s lab. She’s excited to dive into the guts of quantum control systems and is passionate about experimentally verifying theoretical work. If she’s not at the lab, you’ll find Riva at a pottery wheel, training Brazilian jiu-jitsu, devouring horror novels, or skiff sailing!',
  url: 'riva-jangra',
  website: 'https://www.linkedin.com/in/riva-jangra-36b83928b/?originalSubdomain=ca',
}

