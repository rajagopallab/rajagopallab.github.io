<div class="row g-5 mb-5">
  <div>
    <h3 class="fw-bold border-bottom pb-3 mb-5">Publications</h3>
    <h4 class="fw-bold border-bottom pb-3 mb-3">Papers</h4>
    {% if page.title == "Home" %}
      {% for item in site.data.publications.featured %}
        <p><a href="{{ item.url }}"><b>{{ item.name }}</b><br>{{ item.author }}</a></p>
      {% endfor %}
    {% else %}
      {% for item in site.data.publications.index %}
        <p><a href="{{ item.url }}"><b>{{ item.name }}</b></a><br>{{ item.author }} {{ item.cite }}</p>
      {% endfor %}
    {% endif %}
    <!--<h4 class="fw-bold border-bottom pb-3 mb-3 mt-5">Theses</h4>-->
  </div>
</div>
